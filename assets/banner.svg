<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" role="img" aria-label="Muhammad Ajmal Khan - BS Software Engineering Student Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#14b8a6;#3b82f6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#14b8a6;#3b82f6;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#14b8a6">
        <animate attributeName="stop-color" values="#14b8a6;#3b82f6;#8b5cf6;#14b8a6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="chipBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="15%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 800; fill: #f0f6fc; letter-spacing: 0.5px; }
      .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: url(#accentGrad); letter-spacing: 0.8px; }
      .meta { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #8b949e; }
      .chip-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
      .pulse-dot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="996" height="276" x="2" y="2" rx="16" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2"/>
  <rect width="996" height="276" x="2" y="2" rx="16" fill="url(#glowBlue)"/>
  <rect width="996" height="276" x="2" y="2" rx="16" fill="url(#glowTeal)"/>

  <rect x="40" y="2" width="920" height="3" fill="url(#accentGrad)" rx="1.5"/>

  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="210" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#14b8a6" class="pulse-dot"/>
    <text x="30" y="17.5" class="meta" fill="#c9d1d9" font-size="12">Open to Opportunities</text>
  </g>

  <text x="60" y="118" class="title">Muhammad Ajmal Khan</text>
  <text x="60" y="152" class="subtitle">BS SOFTWARE ENGINEERING STUDENT (7TH SEMESTER)</text>
  <text x="60" y="182" class="meta">Government College University Faisalabad (GCUF) • Sahiwal Campus • Sahiwal, Pakistan</text>

  <g transform="translate(60, 210)">
    <g transform="translate(0, 0)">
      <rect width="168" height="32" rx="8" fill="#161b22" stroke="url(#chipBorder)" stroke-width="1.2"/>
      <text x="84" y="20.5" text-anchor="middle" class="chip-text">Software Engineering</text>
    </g>
    <g transform="translate(180, 0)">
      <rect width="165" height="32" rx="8" fill="#161b22" stroke="url(#chipBorder)" stroke-width="1.2"/>
      <text x="82.5" y="20.5" text-anchor="middle" class="chip-text">BS (SE) • 2023–2027</text>
    </g>
    <g transform="translate(357, 0)">
      <rect width="135" height="32" rx="8" fill="#161b22" stroke="url(#chipBorder)" stroke-width="1.2"/>
      <text x="67.5" y="20.5" text-anchor="middle" class="chip-text">7th Semester</text>
    </g>
    <g transform="translate(504, 0)">
      <rect width="175" height="32" rx="8" fill="#161b22" stroke="url(#chipBorder)" stroke-width="1.2"/>
      <text x="87.5" y="20.5" text-anchor="middle" class="chip-text">Computer Science (ICS)</text>
    </g>
    <g transform="translate(691, 0)">
      <rect width="145" height="32" rx="8" fill="#161b22" stroke="url(#chipBorder)" stroke-width="1.2"/>
      <text x="72.5" y="20.5" text-anchor="middle" class="chip-text">Fresh Graduate Track</text>
    </g>
  </g>
</svg>